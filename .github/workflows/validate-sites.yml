name: Validate sites

on:
  pull_request:
    paths: ["sites.json", "scripts/validate_sites.py"]
  push:
    branches: [main]
    paths: ["sites.json", "scripts/validate_sites.py"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_sites.py sites.json
